name: HIC Subscription CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile runtime modules
        # Syntax gate over the whole backend tree. This catches malformed files
        # but NOT unresolvable imports -- compileall never imports anything --
        # which is why the import check below exists.
        run: |
          python -m compileall -q \
            -x '(^|/)(archived|__pycache__|emergentintegrations_local_backup)/' \
            core database middleware models routers routes services sla113 server.py

      - name: Install import-check dependencies
        # The full requirements.txt cannot resolve (emergentintegrations 0.1.1
        # conflicts with the pinned litellm wheel), so this installs the subset
        # the application actually imports, at the versions requirements.txt
        # pins. Keep in sync when a new third-party import is added.
        run: |
          python -m pip install --disable-pip-version-check -q \
            bcrypt==4.1.3 \
            email-validator==2.3.0 \
            fastapi==0.135.3 \
            httpx==0.28.1 \
            motor==3.3.1 \
            psutil==7.2.2 \
            pydantic==2.12.5 \
            pydantic-settings==2.13.1 \
            PyJWT==2.11.0 \
            pymongo==4.5.0 \
            python-dotenv==1.2.2 \
            python-multipart==0.0.22 \
            requests==2.33.1 \
            stripe==15.0.1 \
            uvicorn==0.44.0 \
            websockets==16.0 \
            pytest

      - name: Provide emergentintegrations from the vendored copy
        # emergentintegrations is not on PyPI. The repo carries a self-declared
        # drop-in copy; using it keeps this job hermetic instead of depending on
        # an external index being reachable at build time.
        run: |
          mkdir -p "$RUNNER_TEMP/shim"
          cp -r emergentintegrations_local_backup "$RUNNER_TEMP/shim/emergentintegrations"
          echo "PYTHONPATH=.:$RUNNER_TEMP/shim" >> "$GITHUB_ENV"

      - name: Import the application and check route wiring
        # Imports every registered router and runs every route decorator. A
        # module that does not exist, or a removed framework argument, fails
        # here instead of at container start.
        run: python -m pytest -q tests/test_app_contract.py

      - name: Run model policy unit tests
        run: python -m pytest -q tests/test_model_policy.py

      - name: Run Startup Copilot contract tests
        run: python -m pytest -q tests/test_startup_copilot_contract.py

      - name: Run Genesis Engine tests
        run: python -m pytest -q tests/test_genesis_engine.py tests/test_engine_routes.py

  requirements-resolve:
    # requirements.txt was unresolvable for a long time: it pinned
    # emergentintegrations (not on PyPI) and ALSO pinned litellm by direct URL,
    # which the transitive requirement already pinned without a #sha256=
    # fragment -- two direct-URL requirements for one package only resolve when
    # the URL strings match byte-for-byte. `deploy.sh` runs `set -e`, so a
    # deploy from main died at that install step.
    #
    # This job proves the file still resolves. It downloads nothing and takes
    # about 10 seconds. Both regressions have been confirmed to fail it:
    # dropping the direct-URL pin, and re-adding the litellm line.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve requirements.txt without installing
        # Deliberately not -q: on success the log should show what was
        # resolved. A check whose passing log is empty is hard to audit, and
        # this repo has already shipped one green check that proved nothing.
        run: python -m pip install --dry-run -r requirements.txt

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: npm run build
