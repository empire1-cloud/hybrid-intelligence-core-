name: HIC Subscription CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile changed runtime modules
        run: |
          python -m compileall -q \
            core/engine_context.py \
            middleware/model_policy_middleware.py \
            middleware/subscription_usage_middleware.py \
            routers/engines/core.py \
            services/billing_service.py \
            services/hybrid_core.py \
            services/model_policy.py \
            services/plan_builder.py \
            services/router.py \
            services/strategy_engine.py \
            services/startup_copilot_engines.py \
            services/startup_copilot_models.py \
            routes/startup_copilot_routes.py \
            server.py

      - name: Install test dependencies
        # pytest alone is not enough: the contract tests import the Pydantic
        # models and the router, so the packages those modules import have to be
        # present. The full requirements.txt cannot resolve (emergentintegrations
        # 0.1.1 conflicts with the pinned litellm wheel), so this installs the
        # subset the app imports, at the versions requirements.txt pins.
        run: |
          python -m pip install --disable-pip-version-check -q \
            bcrypt==4.1.3 \
            email-validator==2.3.0 \
            fastapi==0.135.3 \
            httpx==0.28.1 \
            motor==3.3.1 \
            psutil==7.2.2 \
            pydantic==2.12.5 \
            pydantic-settings==2.13.1 \
            PyJWT==2.11.0 \
            pymongo==4.5.0 \
            python-dotenv==1.2.2 \
            python-multipart==0.0.22 \
            requests==2.33.1 \
            stripe==15.0.1 \
            uvicorn==0.44.0 \
            websockets==16.0 \
            pytest

      - name: Run model policy unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_model_policy.py

      - name: Run Startup Copilot contract tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_startup_copilot_contract.py

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production frontend
        env:
          CI: 'false'
          REACT_APP_BACKEND_URL: http://localhost:8001
        run: npm run build
